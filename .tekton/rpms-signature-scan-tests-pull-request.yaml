                fi

                images_processed="$(params.IMAGES_PROCESSED)"
                if [[ "$images_processed" == *"digests: [sha256:076ed8309d59999feab05c43b81bc5134dde3fc974ae127bc6cedf5d95751c2e]"* ]]; then
                  echo "images_processed matches!"
