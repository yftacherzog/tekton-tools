apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-chart
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: product-chart
  template:
    metadata:
      labels:
        app: product-chart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: product-chart
          image: busybox:latest
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
