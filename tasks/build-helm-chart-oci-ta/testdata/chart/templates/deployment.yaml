apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-chart
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: test-chart
  template:
    metadata:
      labels:
        app: test-chart
    spec:
      containers:
        - name: test-chart
          image: busybox:latest
