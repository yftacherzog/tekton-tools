apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-chart
spec:
  replicas: {{.Values.replicaCount}}
  selector:
    matchLabels:
      app: test-chart
  template:
    metadata:
      labels:
        app: test-chart
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: test-chart
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
